[package]
name = "agenttidy-infrastructure"
description = "Platform infrastructure for AgentTidy (filesystem, trash, processes)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agenttidy-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
rusqlite = { workspace = true }
trash = { workspace = true }
sysinfo = { workspace = true }

# Win32 FFI is only linked on Windows builds (red line #11: platform code
# lives only here and in provider path discovery).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
