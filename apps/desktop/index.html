<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#101414" />
    <title>AgentTidy</title>
    <style>
      /* Paint the brand before React loads; the root render replaces this. */
      html, body { margin: 0; background: #101414; }
      .boot-fallback { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; color: #e9eeeb; font: 500 20px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -.5px; }
      .boot-fallback img { width: 112px; height: 112px; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-fallback"><img src="/brand/agenttidy-icon.png" alt="" /><span>AgentTidy</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
