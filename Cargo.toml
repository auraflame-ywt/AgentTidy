[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/application",
    "crates/infrastructure",
    "crates/provider-api",
    "crates/test-support",
    "providers/workbuddy",
    "providers/claude-code",
    "providers/codex",
    "providers/pi",
    "providers/antigravity",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/agenttidy/agenttidy"

[workspace.dependencies]
agenttidy-core = { path = "crates/core" }
agenttidy-application = { path = "crates/application" }
agenttidy-infrastructure = { path = "crates/infrastructure" }
agenttidy-provider-api = { path = "crates/provider-api" }
agenttidy-test-support = { path = "crates/test-support" }
agenttidy-workbuddy = { path = "providers/workbuddy" }
agenttidy-claude-code = { path = "providers/claude-code" }
agenttidy-codex = { path = "providers/codex" }
agenttidy-pi = { path = "providers/pi" }
agenttidy-antigravity = { path = "providers/antigravity" }
# Parse provider timestamps and file URIs without reading transcript bodies.
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
# async-trait: makes AgentProviderAdapter dyn-compatible (boxed futures),
# so the application-layer registry can hold `Box<dyn AgentProviderAdapter>`.
async-trait = "0.1"
# sha2: SHA-256 over the plan fingerprint tuple (Start.md §12.1 last
# step) so the executor can reject a stale plan the user "confirms"
# twice. Tiny dep, no native deps.
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
# comfy-table renders adaptive Unicode tables and ANSI status colors for the
# human CLI surface. JSON remains the separate stable automation contract.
comfy-table = "7"
# Phase 2 infrastructure deps:
# walkdir: read-only directory enumeration (follow_links=false is the default,
# which is what §16.1 link-boundary enforcement relies on).
walkdir = "2"
# rusqlite (bundled): read-only SQLite access (§13.1); bundled so the
# build does not depend on a system libsqlite3 being present.
rusqlite = { version = "0.32", features = ["bundled"] }
# trash: platform-native move-to-trash (Windows Shell Recycle Bin /
# macOS NSWorkspace) — §3.4 "trash first" default.
trash = "5"
# sysinfo: process-presence signals (§16.2 — one signal, not a decision).
sysinfo = "0.30"
# windows-sys: Win32 calls with no std equivalent (file identity via
# BY_HANDLE_FILE_INFORMATION, allocated size via GetCompressedFileSizeW).
# Win32_Security gates CreateFileW's signature (SECURITY_ATTRIBUTES).
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
] }

[profile.release]
lto = true
strip = true
